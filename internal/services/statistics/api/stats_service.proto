syntax = "proto3";

package stats;

option go_package = "github.com/LeonidS635/soa/internal/pkg/services/statspb";

import "google/protobuf/timestamp.proto";

service StatsService {
  rpc GetPostStats(GetPostStatsRequest) returns (GetPostStatsResponse);
  rpc GetPostDynamics(GetPostDynamicsRequest) returns (GetPostDynamicsResponse);
  rpc GetTopPosts(GetTopPostsRequest) returns (GetTopPostsResponse);
  rpc GetTopUsers(GetTopUsersRequest) returns (GetTopUsersResponse);
}

// Metric

enum Metric {
  VIEWS = 0;
  LIKES = 1;
  COMMENTS = 2;
}

// Get post stats

message GetPostStatsRequest {
  int32 post_id = 1;
}

message GetPostStatsResponse {
  uint64 views = 1;
  uint64 likes = 2;
  uint64 comments = 3;
}

// Get post dynamics

message PostStat {
  google.protobuf.Timestamp date = 1;
  uint64 metric_value = 2;
}

message GetPostDynamicsRequest {
  int32 post_id = 1;
  Metric metric = 2;
}

message GetPostDynamicsResponse {
  repeated PostStat dynamics = 1;
}

// Get top posts

message TopPostStat {
  int32 post_id = 1;
  uint64 metric_value = 2;
}

message GetTopPostsRequest {
  Metric metric = 1;
}

message GetTopPostsResponse {
  repeated TopPostStat posts = 1;
}

// Get top users

message TopUserStat {
  int32 user_id = 1;
  uint64 metric_value = 2;
}

message GetTopUsersRequest {
  Metric metric = 1;
}

message GetTopUsersResponse {
  repeated TopUserStat users = 1;
}
