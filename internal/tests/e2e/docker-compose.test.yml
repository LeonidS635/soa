services:
  postgres_users:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    container_name: users_postgres_db

  postgres_posts:
    image: postgres:17-alpine
    ports:
      - "6543:5432"
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    container_name: posts_postgres_db

  clickhouse_stats:
    image: clickhouse/clickhouse-server:latest
    ports:
      - "8123:8123"
      - "9000:9000"
    restart: always
    environment:
      - CLICKHOUSE_DB=clickhouse
      - CLICKHOUSE_USER=clickhouse
      - CLICKHOUSE_PASSWORD=clickhouse
    container_name: clickhouse_stats_db

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    container_name: zookeeper

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "9092" ]
      interval: 1s
      timeout: 5s
      retries: 10
    container_name: kafka

  kafka-init-topics:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - kafka
    entrypoint: "/bin/bash"
    command: >
      -c "
      echo 'Waiting for Kafka to be ready...';
      cub kafka-ready -b kafka:9092 1 30;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic users-registrations --partitions 1 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic posts-views --partitions 1 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic posts-likes --partitions 1 --replication-factor 1;
      kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic posts-comments --partitions 1 --replication-factor 1;"
    container_name: kafka-init-topics

  gateway:
    build:
      context: ../../../
      dockerfile: ./internal/services/gateway/Dockerfile
    ports:
      - "8081:8081"
    container_name: gateway

  user_service:
    build:
      context: ../../../
      dockerfile: ./internal/services/user/Dockerfile
    ports:
      - "8082:8082"
    container_name: user_service

  posts_service:
    build:
      context: ../../../
      dockerfile: ./internal/services/posts/Dockerfile
    ports:
      - "8083:8083"
    container_name: posts_service

  stats_service:
    depends_on:
      kafka:
        condition: service_healthy
    build:
      context: ../../../
      dockerfile: ./internal/services/statistics/Dockerfile
    ports:
      - "8084:8084"
    container_name: stats_service